<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kembil Schools Admin</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root { --main-blue: #0056b3; --light-gray: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--light-gray); }
        nav { width: 260px; background: var(--main-blue); color: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        nav h2 { text-align: center; color: #fff; }
        nav button { display: block; width: 100%; padding: 12px; margin: 10px 0; cursor: pointer; background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 6px; text-align: left; font-weight: bold; }
        nav button.active { background: white; color: var(--main-blue); }
        main { flex: 1; padding: 30px; overflow-y: auto; }
        section.content { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        section.content.active { display: block; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button.submit-btn { background: var(--main-blue); color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        ul { list-style: none; padding: 0; }
    </style>
</head>
<body>

<nav>
    <h2>Kembil Portal</h2>
    <button class="nav-btn active" data-target="addStudent">Add Student</button>
    <button class="nav-btn" data-target="results">Manage Results</button>
    <button class="nav-btn" data-target="payments">Payments</button>
    <button class="nav-btn" data-target="announcements">Announcements</button>
    <button class="nav-btn" data-target="files">Student Files</button>
</nav>

<main>
    <!-- Add Student -->
    <section id="addStudent" class="content active">
        <h3>Add New Student</h3>
        <form id="addStudentForm">
            <input type="text" id="studentName" placeholder="Full Name" required>
            <input type="email" id="studentEmail" placeholder="Email" required>
            <input type="password" id="studentPassword" placeholder="Password" required>
            <select id="studentClass">
                <option value="JSS1">JSS1</option><option value="SS1">SS1</option>
            </select>
            <button type="submit" class="submit-btn">Register Student</button>
        </form>
        <p id="addStudentStatus"></p>
    </section>

    <!-- Results -->
    <section id="results" class="content">
        <h3>Input Results</h3>
        <form id="resultsSelectorForm">
            <input type="text" id="resStudentName" placeholder="Student Name" required>
            <input type="email" id="resStudentEmail" placeholder="Student Email" required>
            <select id="resClass"><option value="JSS1">JSS1</option><option value="SS1">SS1</option></select>
            <select id="resTerm"><option value="1st">1st Term</option><option value="2nd">2nd Term</option></select>
            <input type="text" id="resSession" placeholder="Session (e.g. 2025/2026)" required>
            <button type="submit" class="submit-btn">Load Subjects</button>
        </form>
        <div id="resultsTableContainer" style="display:none;">
            <table id="resultsTable"><tbody id="resultsTableBody"></tbody></table>
            <button id="saveResultsBtn" class="submit-btn">Save Results</button>
        </div>
        <p id="resultsStatus"></p>
    </section>

    <!-- Payments -->
    <section id="payments" class="content">
        <h3>Record Payment</h3>
        <form id="paymentsForm">
            <input type="text" id="payStudentName" placeholder="Student Name" required>
            <input type="email" id="payStudentEmail" placeholder="Email" required>
            <select id="payClass"><option value="JSS1">JSS1</option><option value="SS1">SS1</option></select>
            <select id="payType"><option value="School Fees">School Fees</option><option value="Books">Books</option></select>
            <input type="number" id="payAmount" placeholder="Amount" required>
            <select id="payTerm"><option value="1st">1st Term</option></select>
            <input type="text" id="paySession" placeholder="Session (e.g. 2025/2026)" required>
            <button type="submit" class="submit-btn">Submit Payment</button>
        </form>
        <p id="paymentStatus"></p>
    </section>

    <!-- Announcements -->
    <section id="announcements" class="content">
        <h3>Announcements</h3>
        <form id="announcementsForm">
            <input type="text" id="announceTitle" placeholder="Title" required>
            <textarea id="announceMessage" placeholder="Message" style="width:100%; height:100px;"></textarea>
            <button type="submit" class="submit-btn">Post</button>
        </form>
        <ul id="announcementList"></ul>
        <p id="announceStatus"></p>
    </section>

    <!-- Files -->
    <section id="files" class="content">
        <h3>Student Documents</h3>
        <input type="text" id="studentFileId" placeholder="Enter Student UID">
        <input type="file" id="fileInput">
        <button onclick="uploadFile()" class="submit-btn">Upload</button>
        <ul id="fileList"></ul>
    </section>
</main>
<script>
    /* Navigation */
    const navButtons = document.querySelectorAll("nav button.nav-btn");
    const sections = document.querySelectorAll("section.content");

    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        navButtons.forEach(b => b.classList.remove("active"));
        sections.forEach(s => s.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(btn.dataset.target).classList.add("active");
      });
    });

    /* Firebase Setup */
    firebase.initializeApp({
      apiKey: "AIzaSyDtvLEYFnNmmge6WYTrlrO2BTtkqgBWYxg",
      authDomain: "kembil-schools.firebaseapp.com",
      projectId: "kembil-schools",
      storageBucket: "kembil-schools.appspot.com",
      messagingSenderId: "897542186994",
      appId: "1:897542186994:web:36282b2f8729065edcad6b"
    });

    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();

    /* Add Student */
    const addStudentForm = document.getElementById("addStudentForm");
    const addStudentStatus = document.getElementById("addStudentStatus");

    addStudentForm.addEventListener("submit", e => {
      e.preventDefault();

      const name = studentName.value.trim();
      const email = studentEmail.value.trim();
      const password = studentPassword.value.trim();
      const cls = studentClass.value;

      if (!name || !email || !password || !cls) {
        addStudentStatus.textContent = "❌ Please fill all fields.";
        addStudentStatus.style.color = "red";
        return;
      }

      addStudentStatus.textContent = "Creating student...";

      auth.createUserWithEmailAndPassword(email, password)
        .then(u => db.collection("students")
          .doc(u.user.uid)
          .set({
            name,
            email,
            class: cls,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          })
        )
        .then(() => {
          addStudentStatus.textContent = "✅ Student created successfully!";
          addStudentStatus.style.color = "green";
          addStudentForm.reset();
        })
        .catch(err => {
          addStudentStatus.textContent = "❌ " + err.message;
          addStudentStatus.style.color = "red";
        });
    });

    /* SUBJECTS */
    const subjectsByClass = {
      JSS1:["Mathematics","English","Basic Science","Basic Tech","Information Technology","Business Studies","Social Studies","C.R.S","Civic Education","Home Economics","French","Yoruba","Art"],
      JSS2:["Mathematics","English","Basic Science","Basic Tech","Information Technology","Business Studies","Social Studies","C.R.S","Civic Education","Home Economics","French","Yoruba","Art"],
      JSS3:["Mathematics","English","Basic Science","Basic Tech","Information Technology","Business Studies","Social Studies","C.R.S","Civic Education","Home Economics","French","Yoruba","Art"],

      SS1:["Maths","English","Biology","Chemistry","Physics","Further Maths","Economics","Accounting","C.R.K","Yoruba","Commerce","Government","Literature"],
      SS2:["Maths","English","Biology","Chemistry","Physics","Further Maths","Economics","Accounting","C.R.K","Yoruba","Commerce","Government","Literature"],
      SS3:["Maths","English","Biology","Chemistry","Physics","Further Maths","Economics","Accounting","C.R.K","Yoruba","Commerce","Government","Literature"]
    };

    /* Load Subjects */
    const resultsSelectorForm = document.getElementById("resultsSelectorForm");
    const resultsTableContainer = document.getElementById("resultsTableContainer");
    const resultsTableBody = document.getElementById("resultsTableBody");

    resultsSelectorForm.addEventListener("submit", e => {
      e.preventDefault();

      const cls = resClass.value;
      const subs = subjectsByClass[cls] || [];

      resultsTableBody.innerHTML = "";
      resultsTableContainer.style.display = "none";

      if (subs.length === 0) {
        resultsStatus.textContent = "❌ Select a valid class.";
        resultsStatus.style.color = "red";
        return;
      }

      subs.forEach(sub => {
        const tr = document.createElement("tr");

        const subjCell = document.createElement("td");
        subjCell.textContent = sub;

        const scoreCell = document.createElement("td");
        const scoreInput = document.createElement("input");
        scoreInput.type = "number";
        scoreInput.classList.add("scoreInput");
        scoreInput.min = 0;
        scoreInput.max = 100;
        scoreCell.appendChild(scoreInput);

        const gradeCell = document.createElement("td");
        gradeCell.textContent = "–";

        scoreInput.addEventListener("input", () => {
          const score = parseFloat(scoreInput.value);
          if (isNaN(score)) {
            gradeCell.textContent = "–";
            return;
          }
          gradeCell.textContent =
            score >= 70 ? "A" :
            score >= 60 ? "B" :
            score >= 50 ? "C" :
            score >= 45 ? "D" :
            score >= 40 ? "E" : "F";
        });

        tr.appendChild(subjCell);
        tr.appendChild(scoreCell);
        tr.appendChild(gradeCell);
        resultsTableBody.appendChild(tr);
      });

      resultsStatus.textContent = "";
      resultsTableContainer.style.display = "block";
    });

    /* Save Results */
    const saveResultsBtn = document.getElementById("saveResultsBtn");

    saveResultsBtn.addEventListener("click", async () => {
      const name = resStudentName.value.trim();
      const email = resStudentEmail.value.trim();
      const cls = resClass.value;
      const term = resTerm.value;
      const sessionRaw = resSession.value.trim();
      const session = sessionRaw.replace(/\//g, "_");

      if (!name || !email || !cls || !term || !sessionRaw) {
        resultsStatus.textContent = "❌ Fill all form fields.";
        resultsStatus.style.color = "red";
        return;
      }

      const data = [];
      document.querySelectorAll(".scoreInput").forEach(input => {
        const row = input.parentElement.parentElement; /* FIX */
        const subj = row.cells[0].textContent;
        const score = parseFloat(input.value);

        if (!isNaN(score)) {
          const grade =
            score >= 70 ? "A" :
            score >= 60 ? "B" :
            score >= 50 ? "C" :
            score >= 45 ? "D" :
            score >= 40 ? "E" : "F";

          data.push({ subject: subj, score, grade });
        }
      });

      if (data.length === 0) {
        resultsStatus.textContent = "❌ Enter at least one score.";
        resultsStatus.style.color = "red";
        return;
      }

      resultsStatus.textContent = "Saving...";
      resultsStatus.style.color = "black";

      try {
        const snap = await db.collection("students")
          .where("name","==",name)
          .where("email","==",email)
          .get();

        if (snap.empty) {
          resultsStatus.textContent = "❌ Student not found.";
          resultsStatus.style.color = "red";
          return;
        }

        const uid = snap.docs[0].id;

        await db.collection("students")
          .doc(uid)
          .collection("results")
          .doc(`${session}_${term}`)
          .set({
            studentName: name,
            class: cls,
            term,
            session: sessionRaw,
            records: data,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

        resultsStatus.textContent = "✅ Results saved!";
        resultsStatus.style.color = "green";
        resultsSelectorForm.reset();
        resultsTableContainer.style.display = "none";
      } catch (err) {
        resultsStatus.textContent = "❌ " + err.message;
        resultsStatus.style.color = "red";
      }
    });

    /* Payments */
    const paymentsForm = document.getElementById("paymentsForm");
    const paymentStatus = document.getElementById("paymentStatus");

    paymentsForm.addEventListener("submit", async e => {
      e.preventDefault();

      paymentStatus.textContent = "Processing...";

      const name = payStudentName.value.trim();
      const email = payStudentEmail.value.trim();
      const cls = payClass.value;
      const type = payType.value;
      const amount = parseFloat(payAmount.value);
      const term = payTerm.value;
      const sessionRaw = paySession.value.trim();
      const session = sessionRaw.replace(/\//g, "_");

      if (!name || !email || !cls || !type || !sessionRaw || isNaN(amount)) {
        paymentStatus.textContent = "❌ Fill all fields.";
        paymentStatus.style.color = "red";
        return;
      }

      const paymentData = {
        studentName: name,
        studentEmail: email,
        class: cls,
        paymentType: type,
        amount,
        term,
        session: sessionRaw,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        const snap = await db.collection("students")
          .where("name","==",name)
          .where("email","==",email)
          .get();

        if (snap.empty) {
          paymentStatus.textContent = "❌ Student not found.";
          paymentStatus.style.color = "red";
          return;
        }

        const uid = snap.docs[0].id;

        await db.collection("students").doc(uid).collection("payments").add(paymentData);
        await db.collection("payments").add({ ...paymentData, studentId: uid });

        paymentStatus.textContent = "✅ Payment recorded!";
        paymentStatus.style.color = "green";
        paymentsForm.reset();
      } catch (err) {
        paymentStatus.textContent = "❌ " + err.message;
        paymentStatus.style.color = "red";
      }
    });

    /* Announcements */
    const announcementsForm = document.getElementById("announcementsForm");

    announcementsForm.addEventListener("submit", async e => {
      e.preventDefault();

      const title = announceTitle.value.trim();
      const msg = announceMessage.value.trim();

      if (!title || !msg) {
        announceStatus.textContent = "❌ Fill all fields.";
        announceStatus.style.color = "red";
        return;
      }

      announceStatus.textContent = "Posting...";

      try {
        await db.collection("announcements").add({
          title,
          message: msg,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        announceStatus.textContent = "✅ Posted!";
        announceStatus.style.color = "green";
        announcementsForm.reset();
      } catch (err) {
        announceStatus.textContent = "❌ " + err.message;
        announceStatus.style.color = "red";
      }
    });

/* Announcements Listener WITH DELETE */
db.collection("announcements")
  .orderBy("timestamp", "desc")
  .limit(10)
  .onSnapshot(snapshot => {
    announcementList.innerHTML = "";

    if (snapshot.empty) {
      announcementList.innerHTML = "<li>No announcements yet.</li>";
      return;
    }

    snapshot.forEach(doc => {
      const a = doc.data();
      const id = doc.id;
      const date = a.timestamp ? a.timestamp.toDate().toLocaleString() : "Now";

      const li = document.createElement("li");
      li.style.border = "1px solid #ddd";
      li.style.padding = "10px";
      li.style.marginBottom = "10px";
      li.style.borderRadius = "6px";
      li.style.position = "relative";
      
      li.innerHTML = `
        <strong>${a.title}</strong>
        <span style="position:absolute; right:10px; top:10px; cursor:pointer; font-size:18px; color:#c00;"
              onclick="deleteAnnouncement('${id}')">🗑️</span>
        <br>
        <small>${date}</small><br>
        <p>${a.message}</p>
      `;

      announcementList.appendChild(li);
    });
  });

/* Delete Announcement */
async function deleteAnnouncement(id) {
  const sure = confirm("Delete this announcement?");
  if (!sure) return;

  try {
    await db.collection("announcements").doc(id).delete();
    console.log("Announcement deleted:", id);
  } catch (err) {
    alert("Error deleting announcement: " + err.message);
  }
}

    /* Upload Student Files */
    const studentFileId = document.getElementById("studentFileId");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");

    async function uploadFile() {
      const id = studentFileId.value.trim();
      const file = fileInput.files[0];

      if (!id || !file) {
        alert("Enter student ID and choose a file.");
        return;
      }

      const path = `studentFiles/${id}/${file.name}`;
      const ref = storage.ref(path);

      try {
        await ref.put(file);
        alert("✅ File uploaded!");
        loadFiles(id);
      } catch (err) {
        alert("❌ " + err.message);
      }
    }

    async function loadFiles(id) {
      fileList.innerHTML = "Loading...";

      const folder = storage.ref(`studentFiles/${id}`);

      try {
        const items = await folder.listAll();
        fileList.innerHTML = "";

        if (items.items.length === 0) {
          fileList.innerHTML = "<li>No files uploaded yet.</li>";
          return;
        }

        for (let item of items.items) {
          const url = await item.getDownloadURL();
          const li = document.createElement("li");
          li.innerHTML = `<a href="${url}" target="_blank">${item.name}</a>`;
          fileList.appendChild(li);
        }
      } catch {
        fileList.innerHTML = "<li>Error loading files.</li>";
      }
    }
  </script>
</body>
</html>
